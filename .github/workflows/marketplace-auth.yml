name: Verify Marketplace identity

on:
  workflow_dispatch:
    inputs:
      verify_publish_rights:
        description: Verify publisher permissions after adding the Marketplace member
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Get Marketplace member identity
        shell: bash
        run: |
          set -euo pipefail
          profile_id=$(az rest --url https://app.vssps.visualstudio.com/_apis/profile/profiles/me --resource 499b84ac-1321-427f-aa17-267ca6975798 --query id --output tsv)
          test -n "$profile_id"
          echo "Marketplace member ID: $profile_id"
          echo "Marketplace member ID: $profile_id" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify Marketplace publish rights
        if: ${{ inputs.verify_publish_rights }}
        run: npx --no-install vsce verify-pat Huffer342 --azure-credential
